<!DOCTYPE html>
<html>
<head>
    <title>Exercise 13b</title>
    <style>
        .outer {
            display: flex;
        }
        .item1 {
            width: 100px;
            background-color: #f4a6a6;
        }
        .item2 {
            width: 200px;
            background-color: #a8dadc;
            display: flex;
            flex-direction: column;
        }
        .row {
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
        }

    <div class="outer">
        <div class="item1"></div>
        <div class="item2">
            <div class="row"><span>row1</span></div>
            <div class="row"><span>row2</span><span>row2</span></div>
        </div>
    </div>
</body>
</html>
