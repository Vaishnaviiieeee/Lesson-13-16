<!DOCTYPE html>
<html>
<head>
    <title>Exercise 15c</title>
    <style>
        body {
            height: 3000px;
            margin: 0;
        }
        .box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 320px;
            height: 180px;
            background-color: gray;
        }
        .close-btn {
            position: absolute;
            top: -12px;
            left: -12px;
            width: 30px;
            height: 30px;
            background-color: black;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="close-btn">X</div>
    </div>
</body>
</html>
