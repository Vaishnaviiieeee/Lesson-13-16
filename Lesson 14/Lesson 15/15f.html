<!DOCTYPE html>
<html>
<head>
    <title>Exercise 15f</title>
    <style>
        .product {
            position: relative;
            display: inline-block;
            width: 300px;
            background-color: #f2f2f2;
        }
        .product img {
            width: 100%;
            display: block;
        }
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: black;
            color: white;
            padding: 4px 10px;
            font-size: 13px;
            font-family: Arial, sans-serif;
        }
        .add-to-cart {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background-color: white;
            border: 1px solid #ccc;
            padding: 8px 20px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="product">
        <img src="https://placecats.com/300/300" alt="shirt">
        <div class="badge">20% OFF</div>
        <div class="add-to-cart">Add to Cart</div>
    </div>
</body>
</html>
