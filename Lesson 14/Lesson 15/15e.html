<!DOCTYPE html>
<html>
<head>
    <title>Exercise 15e</title>
    <style>
        .product {
            position: relative;
            display: inline-block;
            width: 300px;
        }
        .product img {
            width: 100%;
            display: block;
            background-color: #ddd;
        }
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: black;
            color: white;
            padding: 4px 10px;
            font-size: 13px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="product">
        <img src="https://placecats.com/300/300" alt="shirt">
        <div class="badge">20% OFF</div>
    </div>
</body>
</html>
