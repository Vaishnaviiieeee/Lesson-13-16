<!DOCTYPE html>
<html>
<head>
    <title>Exercise 16c</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .video-card {
            width: 300px;
        }
        .video-card a {
            text-decoration: none;
            color: inherit;
        }
        .video-card img {
            width: 100%;
            display: block;
        }
        .info-row {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .channel-pic {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }
        .video-title {
            font-weight: bold;
            font-size: 14px;
            margin: 0;
        }
        .channel-name {
            font-size: 13px;
            color: #555;
            margin: 4px 0 0 0;
        }
    </style>
</head>
<body>
    <div class="video-card">
        <a href="https://www.youtube.com/watch?v=WNGWjhVfBEQ">
            <img src="https://placecats.com/300/170" alt="video thumbnail">
        </a>
        <div class="info-row">
            <a href="https://www.youtube.com/channel/UCBJycsmduvYEL83R_U4JriQ">
                <img class="channel-pic" src="https://placecats.com/40/40" alt="channel picture">
            </a>
            <div>
                <p class="video-title">Talking Tech and AI with Google CEO Sundar Pichai!</p>
                <p class="channel-name">Marques Brownlee</p>
            </div>
        </div>
    </div>
</body>
</html>
